
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Baby ❤️</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;overflow-x:hidden;
 font-family:Georgia,serif;color:#78344f;
 background:linear-gradient(145deg,#fff0f5,#ffd6e5,#f9b9d0);
 display:flex;align-items:center;justify-content:center;
 text-align:center;padding:24px
}
.card{
 width:100%;max-width:430px;padding:32px 22px;
 background:rgba(255,255,255,.72);border:1px solid white;
 border-radius:28px;box-shadow:0 15px 50px #b84d7540;
 position:relative;z-index:2
}
.heart{font-size:55px;animation:beat 1s infinite}
h1{font-size:34px;margin:16px 0}
p{font-size:18px;line-height:1.7}
button{
 border:0;border-radius:30px;padding:14px 22px;
 background:#e75480;color:white;font-size:16px;
 font-weight:bold;cursor:pointer;margin:10px 4px;
 box-shadow:0 5px 15px #e7548040
}
#letter{display:none;animation:appear 1s ease}
.petal{
 position:fixed;top:-30px;z-index:1;
 animation:fall linear infinite;pointer-events:none
}
@keyframes beat{50%{transform:scale(1.18)}}
@keyframes appear{from{opacity:0;transform:translateY(18px)}
to{opacity:1;transform:translateY(0)}}
@keyframes fall{to{transform:translateY(110vh) rotate(500deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="heart">💖</div>
  <h1>Hey, Baby! 🌹</h1>
  <p>I made something special just for you...</p>
  <button id="openBtn" onclick="openLetter()">
    Open Your Surprise 💌
  </button>

  <div id="letter">
    <div style="font-size:40px">💌🌷💗</div>
    <h1>For You, Baby</h1>
    <p id="message">Yahan apna personal love message likhna ❤️</p>
    <p>Will you be mine? 💍</p>
    <button onclick="yesAnswer()">YES ❤️</button>
    <button onclick="moreLove()">One More Hug 🫂</button>
    <p id="answer"></p>
  </div>
</div>

<script>
function openLetter(){
 document.getElementById('letter').style.display='block';
 document.getElementById('openBtn').style.display='none';
}
function yesAnswer(){
 document.getElementById('answer').innerHTML=
 'You just made this moment unforgettable! ❤️🥹';
}
function moreLove(){
 document.getElementById('answer').innerHTML=
 'Sending you the biggest hug ever! 🫂💗';
}
for(let i=0;i<22;i++){
 let p=document.createElement('div');
 p.className='petal';
 p.textContent=['🌸','💕','🌹','💗'][i%4];
 p.style.left=Math.random()*100+'vw';
 p.style.animationDuration=(5+Math.random()*8)+'s';
 p.style.animationDelay=(-Math.random()*10)+'s';
 p.style.fontSize=(15+Math.random()*18)+'px';
 document.body.appendChild(p);
}
</script>
</body>
</html>
